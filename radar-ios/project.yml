name: RadarUber
options:
  bundleIdPrefix: br.com.radaruber
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  RadarUber:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/RadarOfferParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.radaruber.app
        INFOPLIST_KEY_CFBundleDisplayName: Radar Uber
        INFOPLIST_KEY_NSCameraUsageDescription: "Não usamos a câmera para ler ofertas."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "O Radar avisa quando uma oferta da Uber merece atenção."
        CODE_SIGN_ENTITLEMENTS: App/RadarUber.entitlements
    dependencies:
      - target: RadarBroadcast
        embed: true
  RadarBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared/RadarOfferParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.radaruber.app.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Radar Leitura
        CODE_SIGN_ENTITLEMENTS: Broadcast/RadarBroadcast.entitlements
