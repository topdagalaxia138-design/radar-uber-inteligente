name: Build Radar iOS

on:
  push:
    paths:
      - "radar-ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "radar-ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec radar-ios/project.yml --project radar-ios
      - name: Build for iOS Simulator
        run: xcodebuild -project radar-ios/RadarUber.xcodeproj -scheme RadarUber -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
