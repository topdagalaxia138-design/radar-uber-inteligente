name: Build Radar iOS

on:
  push:
    paths:
      - "radar-ios/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "radar-ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

concurrency:
  group: radar-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec radar-ios/project.yml --project radar-ios
      - name: Test decision, parsing and financial core
        working-directory: radar-ios
        run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -project radar-ios/RadarUber.xcodeproj -scheme RadarUber -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for physical iPhone without signing
        run: xcodebuild -project radar-ios/RadarUber.xcodeproj -scheme RadarUber -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Preserve unsigned device build for signing
        uses: actions/upload-artifact@v4
        with:
          name: RadarUber-unsigned-device
          path: build/device/Build/Products/Debug-iphoneos/
          if-no-files-found: error
      - name: Package IPA for local re-signing
        shell: bash
        run: |
          mkdir -p build/sideload/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/RadarUber.app build/sideload/Payload/
          codesign --force --sign - --entitlements radar-ios/Broadcast/RadarBroadcast.entitlements --generate-entitlement-der build/sideload/Payload/RadarUber.app/PlugIns/RadarBroadcast.appex
          codesign --force --sign - --entitlements radar-ios/App/RadarUber.entitlements --generate-entitlement-der build/sideload/Payload/RadarUber.app
          codesign --verify --deep --strict build/sideload/Payload/RadarUber.app
          cd build/sideload
          ditto -c -k --keepParent Payload RadarUber-resign.ipa
          shasum -a 256 RadarUber-resign.ipa > RadarUber-resign.ipa.sha256
      - name: Validate packaged app and extension metadata
        run: python3 radar-ios/scripts/verify_ipa.py build/sideload/RadarUber-resign.ipa
      - name: Preserve IPA for Windows installation experiment
        uses: actions/upload-artifact@v4
        with:
          name: RadarUber-resign-IPA
          path: |
            build/sideload/RadarUber-resign.ipa
            build/sideload/RadarUber-resign.ipa.sha256
          if-no-files-found: error
