name: Publicar Radar Uber no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir site
          cd radar_uber_v04_pronto_github_pages/radar_uber_v04
          cp index.html style.css src.js site/ 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/site"
          cp index.html style.css src.js "$GITHUB_WORKSPACE/site/"
          cp public/* "$GITHUB_WORKSPACE/site/"
          touch "$GITHUB_WORKSPACE/site/.nojekyll"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
